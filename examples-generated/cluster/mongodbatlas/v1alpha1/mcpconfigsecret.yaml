apiVersion: mongodbatlas.crossplane.io/v1alpha1
kind: MCPConfigSecret
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/mcpconfigsecret
  labels:
    testing.upbound.io/example-name: this
  name: this
spec:
  forProvider:
    mcpConfigIdSelector:
      matchLabels:
        testing.upbound.io/example-name: this
    orgIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretExpiresAfterHours: 720

---

apiVersion: mongodbatlas.crossplane.io/v1alpha1
kind: MCPConfig
metadata:
  annotations:
    meta.upbound.io/example-id: /v1alpha1/mcpconfigsecret
  labels:
    testing.upbound.io/example-name: this
  name: this
spec:
  forProvider:
    mcpConfigName: example-mcp-config
    orgIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    roles:
    - ORG_READ_ONLY
