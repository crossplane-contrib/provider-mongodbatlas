apiVersion: project.mongodbatlas.crossplane.io/v1alpha1
kind: MCPConfigSecret
metadata:
  annotations:
    meta.upbound.io/example-id: project/v1alpha1/mcpconfigsecret
  labels:
    testing.upbound.io/example-name: this
  name: this
spec:
  forProvider:
    mcpConfigIdSelector:
      matchLabels:
        testing.upbound.io/example-name: this
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretExpiresAfterHours: 720

---

apiVersion: project.mongodbatlas.crossplane.io/v1alpha1
kind: MCPConfig
metadata:
  annotations:
    meta.upbound.io/example-id: project/v1alpha1/mcpconfigsecret
  labels:
    testing.upbound.io/example-name: this
  name: this
spec:
  forProvider:
    mcpConfigName: example-mcp-config
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    roles:
    - GROUP_READ_ONLY
