apiVersion: cloud.mongodbatlas.m.crossplane.io/v1alpha1
kind: BackupCollectionRestoreJob
metadata:
  annotations:
    meta.upbound.io/example-id: cloud/v1alpha1/backupcollectionrestorejob
  labels:
    testing.upbound.io/example-name: this
  name: this
  namespace: crossplane-system
spec:
  forProvider:
    clusterNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    collectionSuffix: ${var.collection_suffix}
    collections: |-
      ${[for ns in var.restore_collections : {
          source_namespace = ns
          target_namespace = try(var.collection_renames[ns], null)
        }]}
    databaseSuffix: ${var.database_suffix}
    databases: |-
      ${[for db in var.restore_databases : {
          source_namespace = db
          target_namespace = try(var.database_renames[db], null)
        }]}
    indexStrategy: ${var.index_strategy}
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    snapshotIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    targetClusterNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    targetProjectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    timeouts:
      create: ${var.create_timeout}
    writeStrategy: ${var.write_strategy}
