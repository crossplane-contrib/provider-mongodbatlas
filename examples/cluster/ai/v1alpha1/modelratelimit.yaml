apiVersion: ai.mongodbatlas.crossplane.io/v1alpha1
kind: ModelRateLimit
metadata:
  annotations:
    meta.upbound.io/example-id: ai/v1alpha1/modelratelimit
  labels:
    testing.upbound.io/example-name: this
  name: this
spec:
  forProvider:
    cloud: ANY
    geography: ANY
    modelGroupName: embed_large
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    requestsPerMinuteLimit: 100
    tokensPerMinuteLimit: 10000
