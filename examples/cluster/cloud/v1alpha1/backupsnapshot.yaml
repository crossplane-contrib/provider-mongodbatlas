apiVersion: cloud.mongodbatlas.crossplane.io/v1alpha1
kind: BackupSnapshot
metadata:
  annotations:
    meta.upbound.io/example-id: cloud/v1alpha1/backupsnapshot
    uptest.upbound.io/timeout: "5400"
  labels:
    testing.upbound.io/example-name: backupsnapshot-test
  name: backupsnapshot-test
spec:
  forProvider:
    clusterNameSelector:
      matchLabels:
        testing.upbound.io/example-name: backupsnapshot-my_cluster
    description: myDescription
    projectId: ${data.mongodbatlas.project_id}
    retentionInDays: 1

---

apiVersion: mongodbatlas.crossplane.io/v1alpha3
kind: AdvancedCluster
metadata:
  annotations:
    meta.upbound.io/example-id: cloud/v1alpha1/backupsnapshot
  labels:
    testing.upbound.io/example-name: backupsnapshot-my_cluster
  name: backupsnapshot-my-cluster
spec:
  forProvider:
    backupEnabled: true
    clusterType: REPLICASET
    name: ${Rand.RFC1123Subdomain}
    projectId: ${data.mongodbatlas.project_id}
    replicationSpecs:
    - regionConfigs:
      - electableSpecs:
          instanceSize: M10
          nodeCount: 3
        priority: 7
        providerName: AWS
        regionName: US_EAST_1
