apiVersion: cloud.mongodbatlas.crossplane.io/v1alpha1
kind: BackupSnapshotExportJob
metadata:
  annotations:
    meta.upbound.io/example-id: cloud/v1alpha1/backupsnapshotexportjob
    upjet.upbound.io/manual-intervention: "Needs an existing S3 bucket and an AWS IAM role that trusts the Atlas AWS account."
  labels:
    testing.upbound.io/example-name: backupsnapshotexportjob-test
  name: backupsnapshotexportjob-test
spec:
  forProvider:
    clusterNameSelector:
      matchLabels:
        testing.upbound.io/example-name: backupsnapshotexportjob-my_cluster
    customData:
    - key: exported by
      value: myName
    exportBucketIdSelector:
      matchLabels:
        testing.upbound.io/example-name: backupsnapshotexportjob-test
    projectId: ${data.mongodbatlas.project_id}
    snapshotIdSelector:
      matchLabels:
        testing.upbound.io/example-name: backupsnapshotexportjob-test

---

apiVersion: cloud.mongodbatlas.crossplane.io/v1alpha1
kind: BackupSnapshotExportBucket
metadata:
  annotations:
    meta.upbound.io/example-id: cloud/v1alpha1/backupsnapshotexportjob
    upjet.upbound.io/manual-intervention: "Needs an existing S3 bucket and an AWS IAM role that trusts the Atlas AWS account."
  labels:
    testing.upbound.io/example-name: backupsnapshotexportjob-test
  name: backupsnapshotexportjob-test
spec:
  forProvider:
    bucketName: example-bucket
    cloudProvider: AWS
    iamRoleIdSelector:
      matchLabels:
        testing.upbound.io/example-name: backupsnapshotexportjob-auth_role
    projectId: ${data.mongodbatlas.project_id}

---

apiVersion: mongodbatlas.crossplane.io/v1alpha3
kind: AdvancedCluster
metadata:
  annotations:
    meta.upbound.io/example-id: cloud/v1alpha1/backupsnapshotexportjob
    upjet.upbound.io/manual-intervention: "Needs an existing S3 bucket and an AWS IAM role that trusts the Atlas AWS account."
  labels:
    testing.upbound.io/example-name: backupsnapshotexportjob-my_cluster
  name: backupsnapshotexportjob-my-cluster
spec:
  forProvider:
    backupEnabled: true
    clusterType: REPLICASET
    name: ${Rand.RFC1123Subdomain}
    projectId: ${data.mongodbatlas.project_id}
    replicationSpecs:
    - regionConfigs:
      - electableSpecs:
          instanceSize: M10
          nodeCount: 3
        priority: 7
        providerName: AWS
        regionName: US_EAST_1

---

apiVersion: cloud.mongodbatlas.crossplane.io/v1alpha1
kind: BackupSnapshot
metadata:
  annotations:
    meta.upbound.io/example-id: cloud/v1alpha1/backupsnapshotexportjob
    upjet.upbound.io/manual-intervention: "Needs an existing S3 bucket and an AWS IAM role that trusts the Atlas AWS account."
  labels:
    testing.upbound.io/example-name: backupsnapshotexportjob-test
  name: backupsnapshotexportjob-test
spec:
  forProvider:
    clusterNameSelector:
      matchLabels:
        testing.upbound.io/example-name: backupsnapshotexportjob-my_cluster
    description: myDescription
    projectId: ${data.mongodbatlas.project_id}
    retentionInDays: 1

---

apiVersion: cloud.mongodbatlas.crossplane.io/v1alpha1
kind: ProviderAccessAuthorization
metadata:
  annotations:
    meta.upbound.io/example-id: cloud/v1alpha1/backupsnapshotexportjob
    upjet.upbound.io/manual-intervention: "Needs an existing S3 bucket and an AWS IAM role that trusts the Atlas AWS account."
  labels:
    testing.upbound.io/example-name: backupsnapshotexportjob-auth_role
  name: backupsnapshotexportjob-auth-role
spec:
  forProvider:
    aws:
    - iamAssumedRoleArn: arn:aws:iam::123456789012:role/atlas-snapshot-export
    projectId: ${data.mongodbatlas.project_id}
    roleIdSelector:
      matchLabels:
        testing.upbound.io/example-name: backupsnapshotexportjob-setup_only

---

apiVersion: cloud.mongodbatlas.crossplane.io/v1alpha1
kind: ProviderAccessSetup
metadata:
  annotations:
    meta.upbound.io/example-id: cloud/v1alpha1/backupsnapshotexportjob
    upjet.upbound.io/manual-intervention: "Needs an existing S3 bucket and an AWS IAM role that trusts the Atlas AWS account."
  labels:
    testing.upbound.io/example-name: backupsnapshotexportjob-setup_only
  name: backupsnapshotexportjob-setup-only
spec:
  forProvider:
    projectId: ${data.mongodbatlas.project_id}
    providerName: AWS
