apiVersion: federated.mongodbatlas.crossplane.io/v1alpha1
kind: DatabaseInstance
metadata:
  annotations:
    meta.upbound.io/example-id: federated/v1alpha1/databaseinstance
  labels:
    testing.upbound.io/example-name: databaseinstance-test
  name: databaseinstance-test
spec:
  forProvider:
    name: ${Rand.RFC1123Subdomain}
    projectId: ${data.mongodbatlas.project_id}
    storageDatabases:
    - collections:
      - dataSources:
        - collection: example_collection
          database: example_db
          storeName: example-store
        name: example_collection
      name: VirtualDatabase0
    storageStores:
    - clusterName: example-cluster
      name: example-store
      projectId: ${data.mongodbatlas.project_id}
      provider: atlas
      readPreference:
      - mode: secondary
