apiVersion: federated.mongodbatlas.crossplane.io/v1alpha1
kind: OrgConfigSettings
metadata:
  annotations:
    meta.upbound.io/example-id: federated/v1alpha1/orgconfigsettings
    upjet.upbound.io/manual-intervention: "Can only be imported: the organization must already be connected to the federation with an identity provider."
  labels:
    testing.upbound.io/example-name: orgconfigsettings-org_connection
  name: orgconfigsettings-org-connection
spec:
  forProvider:
    dataAccessIdentityProviderIds:
    - <data-access-identity-provider-id>
    domainAllowList:
    - example.com
    domainRestrictionEnabled: false
    federationSettingsId: ${data.mongodbatlas.federation_settings_id}
    identityProviderId: <identity-provider-id>
    orgId: ${data.mongodbatlas.org_id}
    postAuthRoleGrants:
    - ORG_MEMBER
