apiVersion: federated.mongodbatlas.crossplane.io/v1alpha1
kind: RoleMapping
metadata:
  annotations:
    meta.upbound.io/example-id: federated/v1alpha1/rolemapping
    upjet.upbound.io/manual-intervention: "Needs an organization connected to federation settings with an identity provider."
  labels:
    testing.upbound.io/example-name: rolemapping-org_group_role_mapping_import
  name: rolemapping-org-group-role-mapping-import
spec:
  forProvider:
    externalGroupName: ${Rand.RFC1123Subdomain}
    federationSettingsId: ${data.mongodbatlas.federation_settings_id}
    orgId: ${data.mongodbatlas.org_id}
    roleAssignments:
    - orgId: ${data.mongodbatlas.org_id}
      roles:
      - ORG_MEMBER
      - ORG_GROUP_CREATOR
      - ORG_BILLING_ADMIN
    - groupId: ${data.mongodbatlas.project_id}
      roles:
      - GROUP_OWNER
      - GROUP_DATA_ACCESS_ADMIN
      - GROUP_SEARCH_INDEX_EDITOR
      - GROUP_DATA_ACCESS_READ_ONLY
      - GROUP_DATA_ACCESS_READ_WRITE
