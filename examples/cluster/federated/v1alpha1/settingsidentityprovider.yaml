apiVersion: federated.mongodbatlas.crossplane.io/v1alpha1
kind: SettingsIdentityProvider
metadata:
  annotations:
    meta.upbound.io/example-id: federated/v1alpha1/settingsidentityprovider
    upjet.upbound.io/manual-intervention: "SAML identity providers can only be imported, not created."
  labels:
    testing.upbound.io/example-name: settingsidentityprovider-identity_provider
  name: settingsidentityprovider-identity-provider
spec:
  forProvider:
    associatedDomains:
    - example.com
    federationSettingsId: ${data.mongodbatlas.federation_settings_id}
    issuerUri: http://www.okta.com/exk17q7f7f7f7fp50h8
    name: mongodb_federation_test
    requestBinding: HTTP-POST
    responseSignatureAlgorithm: SHA-256
    ssoDebugEnabled: true
    ssoUrl: https://mysso.oktapreview.com/app/mysso_terraformtestsso/exk17q7f7f7f7f50h8/sso/saml
    status: ACTIVE
