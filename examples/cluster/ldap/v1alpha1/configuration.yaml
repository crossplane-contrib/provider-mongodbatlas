apiVersion: ldap.mongodbatlas.crossplane.io/v1alpha1
kind: Configuration
metadata:
  annotations:
    meta.upbound.io/example-id: ldap/v1alpha1/configuration
    upjet.upbound.io/manual-intervention: "Needs a reachable LDAP server and bind credentials in the referenced Secret."
  labels:
    testing.upbound.io/example-name: configuration-test
  name: configuration-test
spec:
  forProvider:
    authenticationEnabled: true
    bindPasswordSecretRef:
      key: example-key
      name: example-secret
      namespace: crossplane-system
    bindUsername: CN=atlas,OU=users,DC=example,DC=com
    hostname: ldap.example.com
    port: 636
    projectId: ${data.mongodbatlas.project_id}
