apiVersion: mongodbatlas.crossplane.io/v1alpha1
kind: AccessListAPIKey
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/accesslistapikey
  labels:
    testing.upbound.io/example-name: accesslistapikey-test
  name: accesslistapikey-test
spec:
  forProvider:
    apiKeyIdSelector:
      matchLabels:
        testing.upbound.io/example-name: accesslistapikey-example
    cidrBlock: 1.2.3.4/32
    orgId: ${data.mongodbatlas.org_id}

---

apiVersion: mongodbatlas.crossplane.io/v1alpha1
kind: APIKey
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/accesslistapikey
  labels:
    testing.upbound.io/example-name: accesslistapikey-example
  name: accesslistapikey-example
spec:
  forProvider:
    description: Example API Key
    orgId: ${data.mongodbatlas.org_id}
    roleNames:
    - ORG_READ_ONLY
