apiVersion: mongodbatlas.crossplane.io/v1alpha1
kind: FlexCluster
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/flexcluster
    uptest.upbound.io/timeout: "3600"
  labels:
    testing.upbound.io/example-name: flexcluster-example-cluster
  name: flexcluster-example-cluster
spec:
  forProvider:
    name: ${Rand.RFC1123Subdomain}
    projectId: ${data.mongodbatlas.project_id}
    providerSettings:
      backingProviderName: AWS
      regionName: US_EAST_1
    terminationProtectionEnabled: false
