apiVersion: mongodbatlas.crossplane.io/v1alpha1
kind: GlobalClusterConfig
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/globalclusterconfig
    uptest.upbound.io/timeout: "3600"
  labels:
    testing.upbound.io/example-name: globalclusterconfig-config
  name: globalclusterconfig-config
spec:
  forProvider:
    clusterNameSelector:
      matchLabels:
        testing.upbound.io/example-name: globalclusterconfig-test
    customZoneMappings:
    - location: CA
      zone: Zone 1
    managedNamespaces:
    - collection: publishers
      customShardKey: city
      db: mydata
      isCustomShardKeyHashed: false
      isShardKeyUnique: false
    projectId: ${data.mongodbatlas.project_id}

---

apiVersion: mongodbatlas.crossplane.io/v1alpha3
kind: AdvancedCluster
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/globalclusterconfig
  labels:
    testing.upbound.io/example-name: globalclusterconfig-test
  name: globalclusterconfig-test
spec:
  forProvider:
    clusterType: GEOSHARDED
    name: ${Rand.RFC1123Subdomain}
    projectId: ${data.mongodbatlas.project_id}
    replicationSpecs:
    - regionConfigs:
      - electableSpecs:
          instanceSize: M10
          nodeCount: 3
        priority: 7
        providerName: AWS
        regionName: US_EAST_1
      zoneName: Zone 1
