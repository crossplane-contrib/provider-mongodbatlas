apiVersion: mongodbatlas.crossplane.io/v1alpha1
kind: OnlineArchive
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/onlinearchive
    uptest.upbound.io/timeout: "3600"
    uptest.upbound.io/pre-assert-hook: ../../../testhooks/load-sample-data.sh
  labels:
    testing.upbound.io/example-name: onlinearchive-test
  name: onlinearchive-test
spec:
  forProvider:
    clusterNameSelector:
      matchLabels:
        testing.upbound.io/example-name: onlinearchive-example
    collName: listingsAndReviews
    criteria:
    - dateField: last_review
      dateFormat: ISODATE
      expireAfterDays: 2
      type: DATE
    dbName: sample_airbnb
    partitionFields:
    - fieldName: last_review
      order: 0
    - fieldName: maximum_nights
      order: 1
    - fieldName: name
      order: 2
    projectId: ${data.mongodbatlas.project_id}
    schedule:
    - endHour: 1
      endMinute: 1
      startHour: 1
      startMinute: 1
      type: DAILY

---

apiVersion: mongodbatlas.crossplane.io/v1alpha3
kind: AdvancedCluster
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/onlinearchive
  labels:
    testing.upbound.io/load-sample-data: "true"
    testing.upbound.io/example-name: onlinearchive-example
  name: onlinearchive-example
spec:
  forProvider:
    clusterType: REPLICASET
    name: ${Rand.RFC1123Subdomain}
    projectId: ${data.mongodbatlas.project_id}
    replicationSpecs:
    - regionConfigs:
      - electableSpecs:
          instanceSize: M10
          nodeCount: 3
        priority: 7
        providerName: AWS
        regionName: US_EAST_1
