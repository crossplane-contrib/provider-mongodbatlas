apiVersion: mongodbatlas.crossplane.io/v1alpha1
kind: PushBasedLogExport
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/pushbasedlogexport
    upjet.upbound.io/manual-intervention: "Needs an existing S3 bucket and an AWS IAM role that trusts the Atlas AWS account."
  labels:
    testing.upbound.io/example-name: pushbasedlogexport-test
  name: pushbasedlogexport-test
spec:
  forProvider:
    bucketName: example-atlas-logs
    iamRoleIdSelector:
      matchLabels:
        testing.upbound.io/example-name: pushbasedlogexport-auth_role
    prefixPath: push-based-log-test
    projectId: ${data.mongodbatlas.project_id}

---

apiVersion: cloud.mongodbatlas.crossplane.io/v1alpha1
kind: ProviderAccessAuthorization
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/pushbasedlogexport
    upjet.upbound.io/manual-intervention: "Needs an existing S3 bucket and an AWS IAM role that trusts the Atlas AWS account."
  labels:
    testing.upbound.io/example-name: pushbasedlogexport-auth_role
  name: pushbasedlogexport-auth-role
spec:
  forProvider:
    aws:
    - iamAssumedRoleArn: arn:aws:iam::123456789012:role/atlas-log-export
    projectId: ${data.mongodbatlas.project_id}
    roleIdSelector:
      matchLabels:
        testing.upbound.io/example-name: pushbasedlogexport-setup_only

---

apiVersion: cloud.mongodbatlas.crossplane.io/v1alpha1
kind: ProviderAccessSetup
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/pushbasedlogexport
    upjet.upbound.io/manual-intervention: "Needs an existing S3 bucket and an AWS IAM role that trusts the Atlas AWS account."
  labels:
    testing.upbound.io/example-name: pushbasedlogexport-setup_only
  name: pushbasedlogexport-setup-only
spec:
  forProvider:
    projectId: ${data.mongodbatlas.project_id}
    providerName: AWS
