apiVersion: mongodbatlas.crossplane.io/v1alpha1
kind: ServiceAccountAccessListEntry
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/serviceaccountaccesslistentry
  labels:
    testing.upbound.io/example-name: serviceaccountaccesslistentry-cidr
  name: serviceaccountaccesslistentry-cidr
spec:
  forProvider:
    cidrBlock: 1.2.3.4/32
    clientIdSelector:
      matchLabels:
        testing.upbound.io/example-name: serviceaccountaccesslistentry-this
    orgId: ${data.mongodbatlas.org_id}

---

apiVersion: mongodbatlas.crossplane.io/v1alpha1
kind: ServiceAccount
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/serviceaccountaccesslistentry
  labels:
    testing.upbound.io/example-name: serviceaccountaccesslistentry-this
  name: serviceaccountaccesslistentry-this
spec:
  forProvider:
    description: Example Service Account
    name: example-service-account
    orgId: ${data.mongodbatlas.org_id}
    roles:
    - ORG_READ_ONLY
    secretExpiresAfterHours: 2160
