apiVersion: mongodbatlas.crossplane.io/v1alpha2
kind: Cluster
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha2/cluster
    uptest.upbound.io/timeout: "3600"
  labels:
    testing.upbound.io/example-name: cluster-cluster-test
  name: cluster-cluster-test
spec:
  forProvider:
    autoScalingDiskGbEnabled: true
    cloudBackup: true
    clusterType: REPLICASET
    mongoDbMajorVersion: "7.0"
    name: ${Rand.RFC1123Subdomain}
    projectId: ${data.mongodbatlas.project_id}
    providerInstanceSizeName: M10
    providerName: AWS
    replicationSpecs:
    - numShards: 1
      regionsConfig:
      - electableNodes: 3
        priority: 7
        readOnlyNodes: 0
        regionName: US_EAST_1
