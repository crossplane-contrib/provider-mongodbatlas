apiVersion: network.mongodbatlas.crossplane.io/v1alpha1
kind: Peering
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1alpha1/peering
    upjet.upbound.io/manual-intervention: "Needs an AWS VPC and account to peer with."
  labels:
    testing.upbound.io/example-name: peering-test
  name: peering-test
spec:
  forProvider:
    accepterRegionName: us-east-1
    awsAccountId: "123456789012"
    containerIdSelector:
      matchLabels:
        testing.upbound.io/example-name: peering-test
    projectId: ${data.mongodbatlas.project_id}
    providerName: AWS
    routeTableCidrBlock: 192.168.0.0/24
    vpcId: vpc-0123456789abcdef0

---

apiVersion: network.mongodbatlas.crossplane.io/v1alpha1
kind: Container
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1alpha1/peering
    upjet.upbound.io/manual-intervention: "Needs an AWS VPC and account to peer with."
  labels:
    testing.upbound.io/example-name: peering-test
  name: peering-test
spec:
  forProvider:
    atlasCidrBlock: 10.8.0.0/21
    projectId: ${data.mongodbatlas.project_id}
    providerName: AWS
    regionName: US_EAST_1
