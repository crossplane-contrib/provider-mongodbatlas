apiVersion: project.mongodbatlas.crossplane.io/v1alpha1
kind: MCPConfigSecret
metadata:
  annotations:
    meta.upbound.io/example-id: project/v1alpha1/mcpconfigsecret
  labels:
    testing.upbound.io/example-name: mcpconfigsecret-example
  name: mcpconfigsecret-example
spec:
  forProvider:
    mcpConfigIdSelector:
      matchLabels:
        testing.upbound.io/example-name: mcpconfigsecret-example
    projectId: ${data.mongodbatlas.project_id}
    secretExpiresAfterHours: 720
  writeConnectionSecretToRef:
    name: mcpconfigsecret-example
    namespace: crossplane-system

---

apiVersion: project.mongodbatlas.crossplane.io/v1alpha1
kind: MCPConfig
metadata:
  annotations:
    meta.upbound.io/example-id: project/v1alpha1/mcpconfigsecret
  labels:
    testing.upbound.io/example-name: mcpconfigsecret-example
  name: mcpconfigsecret-example
spec:
  forProvider:
    mcpConfigName: mcpconfigsecret-example
    projectId: ${data.mongodbatlas.project_id}
    roles:
    - GROUP_READ_ONLY
