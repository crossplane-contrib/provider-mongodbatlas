apiVersion: project.mongodbatlas.crossplane.io/v1alpha1
kind: ServiceAccount
metadata:
  annotations:
    meta.upbound.io/example-id: project/v1alpha1/serviceaccount
  labels:
    testing.upbound.io/example-name: serviceaccount-this
  name: serviceaccount-this
spec:
  forProvider:
    description: Example Project Service Account
    name: example-project-service-account
    projectId: ${data.mongodbatlas.project_id}
    roles:
    - GROUP_READ_ONLY
    secretExpiresAfterHours: 2160
