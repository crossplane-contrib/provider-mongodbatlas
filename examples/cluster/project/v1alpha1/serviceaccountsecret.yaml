apiVersion: project.mongodbatlas.crossplane.io/v1alpha1
kind: ServiceAccountSecret
metadata:
  annotations:
    meta.upbound.io/example-id: project/v1alpha1/serviceaccountsecret
  labels:
    testing.upbound.io/example-name: serviceaccountsecret-this
  name: serviceaccountsecret-this
spec:
  forProvider:
    clientIdSelector:
      matchLabels:
        testing.upbound.io/example-name: serviceaccountsecret-this
    projectId: ${data.mongodbatlas.project_id}
    secretExpiresAfterHours: 2160

---

apiVersion: project.mongodbatlas.crossplane.io/v1alpha1
kind: ServiceAccount
metadata:
  annotations:
    meta.upbound.io/example-id: project/v1alpha1/serviceaccountsecret
  labels:
    testing.upbound.io/example-name: serviceaccountsecret-this
  name: serviceaccountsecret-this
spec:
  forProvider:
    description: Example Project Service Account
    name: example-project-service-account
    projectId: ${data.mongodbatlas.project_id}
    roles:
    - GROUP_READ_ONLY
    secretExpiresAfterHours: 2160
