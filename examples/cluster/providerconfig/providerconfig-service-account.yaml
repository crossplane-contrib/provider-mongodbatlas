# Authenticates with an Atlas service account instead of a programmatic API key.
# The credentials JSON carries client_id and client_secret; when both key pairs
# are present the service account takes precedence.
apiVersion: mongodbatlas.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: Secret
    secretRef:
      name: provider-service-account
      namespace: crossplane-system
      key: credentials
---
apiVersion: v1
kind: Secret
metadata:
  name: provider-service-account
  namespace: crossplane-system
type: Opaque
stringData:
  credentials: |
    {
      "client_id": "your-service-account-client-id",
      "client_secret": "your-service-account-client-secret"
    }
