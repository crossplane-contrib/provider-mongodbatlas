apiVersion: search.mongodbatlas.crossplane.io/v1alpha1
kind: Deployment
metadata:
  annotations:
    meta.upbound.io/example-id: search/v1alpha1/deployment
    uptest.upbound.io/timeout: "3600"
  labels:
    testing.upbound.io/example-name: deployment-example
  name: deployment-example
spec:
  forProvider:
    clusterNameSelector:
      matchLabels:
        testing.upbound.io/example-name: deployment-example
    projectId: ${data.mongodbatlas.project_id}
    specs:
    - instanceSize: S20_HIGHCPU_NVME
      nodeCount: 2

---

apiVersion: mongodbatlas.crossplane.io/v1alpha3
kind: AdvancedCluster
metadata:
  annotations:
    meta.upbound.io/example-id: search/v1alpha1/deployment
  labels:
    testing.upbound.io/example-name: deployment-example
  name: deployment-example
spec:
  forProvider:
    clusterType: REPLICASET
    name: ${Rand.RFC1123Subdomain}
    projectId: ${data.mongodbatlas.project_id}
    replicationSpecs:
    - regionConfigs:
      - electableSpecs:
          instanceSize: M10
          nodeCount: 3
        priority: 7
        providerName: AWS
        regionName: US_EAST_1
