apiVersion: serverless.mongodbatlas.crossplane.io/v1alpha1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: serverless/v1alpha1/instance
    upjet.upbound.io/manual-intervention: "Atlas no longer creates Serverless instances; use FlexCluster instead."
  labels:
    testing.upbound.io/example-name: instance-test
  name: instance-test
spec:
  forProvider:
    name: example-serverless
    projectId: ${data.mongodbatlas.project_id}
    providerSettingsBackingProviderName: AWS
    providerSettingsProviderName: SERVERLESS
    providerSettingsRegionName: US_EAST_1
