apiVersion: stream.mongodbatlas.crossplane.io/v1alpha1
kind: Connection
metadata:
  annotations:
    meta.upbound.io/example-id: stream/v1alpha1/connection
    uptest.upbound.io/timeout: "3600"
  labels:
    testing.upbound.io/example-name: connection-test
  name: connection-test
spec:
  forProvider:
    clusterNameSelector:
      matchLabels:
        testing.upbound.io/example-name: connection-example
    connectionName: ConnectionName
    dbRoleToExecute:
      role: atlasAdmin
      type: BUILT_IN
    projectId: ${data.mongodbatlas.project_id}
    type: Cluster
    workspaceNameSelector:
      matchLabels:
        testing.upbound.io/example-name: connection-example

---

apiVersion: stream.mongodbatlas.crossplane.io/v1alpha1
kind: Workspace
metadata:
  annotations:
    meta.upbound.io/example-id: stream/v1alpha1/connection
  labels:
    testing.upbound.io/example-name: connection-example
  name: connection-example
spec:
  forProvider:
    dataProcessRegion:
      cloudProvider: AWS
      region: VIRGINIA_USA
    projectId: ${data.mongodbatlas.project_id}
    workspaceName: ${Rand.RFC1123Subdomain}

---

apiVersion: mongodbatlas.crossplane.io/v1alpha3
kind: AdvancedCluster
metadata:
  annotations:
    meta.upbound.io/example-id: stream/v1alpha1/connection
  labels:
    testing.upbound.io/example-name: connection-example
  name: connection-example
spec:
  forProvider:
    clusterType: REPLICASET
    name: ${Rand.RFC1123Subdomain}
    projectId: ${data.mongodbatlas.project_id}
    replicationSpecs:
    - regionConfigs:
      - electableSpecs:
          instanceSize: M10
          nodeCount: 3
        priority: 7
        providerName: AWS
        regionName: US_EAST_1
