apiVersion: team.mongodbatlas.crossplane.io/v1alpha1
kind: ProjectAssignment
metadata:
  annotations:
    meta.upbound.io/example-id: team/v1alpha1/projectassignment
  labels:
    testing.upbound.io/example-name: projectassignment-this
  name: projectassignment-this
spec:
  forProvider:
    projectId: ${data.mongodbatlas.project_id}
    roleNames:
    - GROUP_OWNER
    - GROUP_DATA_ACCESS_ADMIN
    teamIdSelector:
      matchLabels:
        testing.upbound.io/example-name: projectassignment-this

---

apiVersion: mongodbatlas.crossplane.io/v1alpha1
kind: Team
metadata:
  annotations:
    meta.upbound.io/example-id: team/v1alpha1/projectassignment
  labels:
    testing.upbound.io/example-name: projectassignment-this
  name: projectassignment-this
spec:
  forProvider:
    name: ${Rand.RFC1123Subdomain}
    orgId: ${data.mongodbatlas.org_id}
