apiVersion: cloud.mongodbatlas.m.crossplane.io/v1alpha1
kind: BackupCompliancePolicy
metadata:
  annotations:
    meta.upbound.io/example-id: cloud/v1alpha1/backupcompliancepolicy
    upjet.upbound.io/manual-intervention: "Once enabled, a Backup Compliance Policy can only be disabled by MongoDB Support, so the test project could not be cleaned up."
  labels:
    testing.upbound.io/example-name: backupcompliancepolicy-backup_policy
  name: backupcompliancepolicy-backup-policy
  namespace: crossplane-system
spec:
  forProvider:
    authorizedEmail: user@example.com
    authorizedUserFirstName: First
    authorizedUserLastName: Last
    copyProtectionEnabled: false
    encryptionAtRestEnabled: false
    onDemandPolicyItem:
    - frequencyInterval: 1
      retentionUnit: days
      retentionValue: 3
    pitEnabled: false
    policyItemDaily:
    - frequencyInterval: 1
      retentionUnit: days
      retentionValue: 7
    policyItemHourly:
    - frequencyInterval: 1
      retentionUnit: days
      retentionValue: 7
    policyItemMonthly:
    - frequencyInterval: 1
      retentionUnit: months
      retentionValue: 12
    policyItemWeekly:
    - frequencyInterval: 1
      retentionUnit: weeks
      retentionValue: 4
    policyItemYearly:
    - frequencyInterval: 1
      retentionUnit: years
      retentionValue: 1
    projectId: ${data.mongodbatlas.project_id}
    restoreWindowDays: 7

---

apiVersion: mongodbatlas.m.crossplane.io/v1alpha3
kind: AdvancedCluster
metadata:
  annotations:
    meta.upbound.io/example-id: cloud/v1alpha1/backupcompliancepolicy
    upjet.upbound.io/manual-intervention: "Once enabled, a Backup Compliance Policy can only be disabled by MongoDB Support, so the test project could not be cleaned up."
  labels:
    testing.upbound.io/example-name: backupcompliancepolicy-my_cluster
  name: backupcompliancepolicy-my-cluster
  namespace: crossplane-system
spec:
  forProvider:
    backupEnabled: true
    clusterType: REPLICASET
    name: ${Rand.RFC1123Subdomain}
    projectId: ${data.mongodbatlas.project_id}
    replicationSpecs:
    - regionConfigs:
      - electableSpecs:
          instanceSize: M10
          nodeCount: 3
        priority: 7
        providerName: AWS
        regionName: US_EAST_1

---

apiVersion: cloud.mongodbatlas.m.crossplane.io/v1alpha1
kind: BackupSchedule
metadata:
  annotations:
    meta.upbound.io/example-id: cloud/v1alpha1/backupcompliancepolicy
    upjet.upbound.io/manual-intervention: "Once enabled, a Backup Compliance Policy can only be disabled by MongoDB Support, so the test project could not be cleaned up."
  labels:
    testing.upbound.io/example-name: backupcompliancepolicy-test
  name: backupcompliancepolicy-test
  namespace: crossplane-system
spec:
  forProvider:
    clusterNameSelector:
      matchLabels:
        testing.upbound.io/example-name: backupcompliancepolicy-my_cluster
    policyItemDaily:
    - frequencyInterval: 1
      retentionUnit: days
      retentionValue: 7
    policyItemHourly:
    - frequencyInterval: 1
      retentionUnit: days
      retentionValue: 7
    policyItemMonthly:
    - frequencyInterval: 1
      retentionUnit: months
      retentionValue: 12
    policyItemWeekly:
    - frequencyInterval: 1
      retentionUnit: weeks
      retentionValue: 4
    policyItemYearly:
    - frequencyInterval: 1
      retentionUnit: years
      retentionValue: 1
    projectId: ${data.mongodbatlas.project_id}
    referenceHourOfDay: 3
    referenceMinuteOfHour: 45
    restoreWindowDays: 4
