apiVersion: cloud.mongodbatlas.m.crossplane.io/v1alpha1
kind: ProviderAccessAuthorization
metadata:
  annotations:
    meta.upbound.io/example-id: cloud/v1alpha1/provideraccessauthorization
    upjet.upbound.io/manual-intervention: "Needs an AWS IAM role that trusts the Atlas AWS account with the external ID from ProviderAccessSetup."
  labels:
    testing.upbound.io/example-name: provideraccessauthorization-auth_role
  name: provideraccessauthorization-auth-role
  namespace: crossplane-system
spec:
  forProvider:
    aws:
    - iamAssumedRoleArn: arn:aws:iam::123456789012:role/test-user-role
    projectId: ${data.mongodbatlas.project_id}
    roleIdSelector:
      matchLabels:
        testing.upbound.io/example-name: provideraccessauthorization-setup_only

---

apiVersion: cloud.mongodbatlas.m.crossplane.io/v1alpha1
kind: ProviderAccessSetup
metadata:
  annotations:
    meta.upbound.io/example-id: cloud/v1alpha1/provideraccessauthorization
    upjet.upbound.io/manual-intervention: "Needs an AWS IAM role that trusts the Atlas AWS account with the external ID from ProviderAccessSetup."
  labels:
    testing.upbound.io/example-name: provideraccessauthorization-setup_only
  name: provideraccessauthorization-setup-only
  namespace: crossplane-system
spec:
  forProvider:
    projectId: ${data.mongodbatlas.project_id}
    providerName: AWS
