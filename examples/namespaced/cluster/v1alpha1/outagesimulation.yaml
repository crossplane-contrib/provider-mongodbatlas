apiVersion: cluster.mongodbatlas.m.crossplane.io/v1alpha1
kind: OutageSimulation
metadata:
  annotations:
    meta.upbound.io/example-id: cluster/v1alpha1/outagesimulation
    uptest.upbound.io/timeout: "3600"
  labels:
    testing.upbound.io/example-name: outagesimulation-outage_simulation
  name: outagesimulation-outage-simulation
  namespace: crossplane-system
spec:
  forProvider:
    clusterNameSelector:
      matchLabels:
        testing.upbound.io/example-name: outagesimulation-example
    outageFilters:
    - cloudProvider: AWS
      regionName: US_EAST_2
    projectId: ${data.mongodbatlas.project_id}

---

apiVersion: mongodbatlas.m.crossplane.io/v1alpha3
kind: AdvancedCluster
metadata:
  annotations:
    meta.upbound.io/example-id: cluster/v1alpha1/outagesimulation
    # While the outage simulation runs, Atlas keeps the cluster UPDATING and its
    # Ready/UpToDate conditions can lag until the simulation ends in the delete
    # step, so uptest asserts Synced only for this cluster.
    uptest.upbound.io/conditions: "Synced"
  labels:
    testing.upbound.io/example-name: outagesimulation-example
  name: outagesimulation-example
  namespace: crossplane-system
spec:
  forProvider:
    clusterType: REPLICASET
    name: ${Rand.RFC1123Subdomain}
    projectId: ${data.mongodbatlas.project_id}
    replicationSpecs:
    - regionConfigs:
      - electableSpecs:
          instanceSize: M10
          nodeCount: 2
        priority: 7
        providerName: AWS
        regionName: US_EAST_1
      - electableSpecs:
          instanceSize: M10
          nodeCount: 1
        priority: 6
        providerName: AWS
        regionName: US_EAST_2
