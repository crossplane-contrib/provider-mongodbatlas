apiVersion: database.mongodbatlas.m.crossplane.io/v1alpha1
kind: X509UserAuthentication
metadata:
  annotations:
    meta.upbound.io/example-id: database/v1alpha1/x509userauthentication
  labels:
    testing.upbound.io/example-name: x509userauthentication-test
  name: x509userauthentication-test
  namespace: crossplane-system
spec:
  forProvider:
    monthsUntilExpiration: 2
    projectId: ${data.mongodbatlas.project_id}
    usernameSelector:
      matchLabels:
        testing.upbound.io/example-name: x509userauthentication-user

---

apiVersion: database.mongodbatlas.m.crossplane.io/v1alpha3
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: database/v1alpha1/x509userauthentication
  labels:
    testing.upbound.io/example-name: x509userauthentication-user
  name: x509userauthentication-user
  namespace: crossplane-system
spec:
  forProvider:
    authDatabaseName: $external
    labels:
    - key: My Key
      value: My Value
    projectId: ${data.mongodbatlas.project_id}
    roles:
    - databaseName: admin
      roleName: atlasAdmin
    username: ${Rand.RFC1123Subdomain}
    x509Type: MANAGED
