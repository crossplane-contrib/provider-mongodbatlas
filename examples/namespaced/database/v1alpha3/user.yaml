apiVersion: database.mongodbatlas.m.crossplane.io/v1alpha3
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: database/v1alpha3/user
  labels:
    testing.upbound.io/example-name: user-test
  name: user-test
  namespace: crossplane-system
spec:
  forProvider:
    authDatabaseName: admin
    labels:
    - key: My Key
      value: My Value
    projectId: ${data.mongodbatlas.project_id}
    roles:
    - databaseName: dbforApp
      roleName: readWrite
    - databaseName: admin
      roleName: readAnyDatabase
    username: ${Rand.RFC1123Subdomain}
  writeConnectionSecretToRef:
    name: example-db-user
