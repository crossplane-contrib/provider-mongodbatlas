apiVersion: encryptionatrest.mongodbatlas.m.crossplane.io/v1alpha1
kind: PrivateEndpoint
metadata:
  annotations:
    meta.upbound.io/example-id: encryptionatrest/v1alpha1/privateendpoint
    upjet.upbound.io/manual-intervention: "Needs an Azure Key Vault with a key and an Azure service principal in the referenced Secrets."
  labels:
    testing.upbound.io/example-name: privateendpoint-endpoint
  name: privateendpoint-endpoint
  namespace: crossplane-system
spec:
  forProvider:
    cloudProvider: AZURE
    projectId: ${data.mongodbatlas.project_id}
    regionName: US_EAST_2

---

apiVersion: mongodbatlas.m.crossplane.io/v1alpha1
kind: EncryptionAtRest
metadata:
  annotations:
    meta.upbound.io/example-id: encryptionatrest/v1alpha1/privateendpoint
    upjet.upbound.io/manual-intervention: "Needs an Azure Key Vault with a key and an Azure service principal in the referenced Secrets."
  labels:
    testing.upbound.io/example-name: privateendpoint-ear
  name: privateendpoint-ear
  namespace: crossplane-system
spec:
  forProvider:
    azureKeyVaultConfig:
    - azureEnvironment: AZURE
      clientIdSecretRef:
        key: example-key
        name: example-secret
      enabled: true
      keyIdentifierSecretRef:
        key: example-key
        name: example-secret
      keyVaultName: example-key-vault
      requirePrivateNetworking: true
      resourceGroupName: example-resource-group
      secretSecretRef:
        key: example-key
        name: example-secret
      subscriptionIdSecretRef:
        key: example-key
        name: example-secret
      tenantIdSecretRef:
        key: example-key
        name: example-secret
    projectId: ${data.mongodbatlas.project_id}
