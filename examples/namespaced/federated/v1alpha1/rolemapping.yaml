apiVersion: federated.mongodbatlas.m.crossplane.io/v1alpha1
kind: RoleMapping
metadata:
  annotations:
    meta.upbound.io/example-id: federated/v1alpha1/rolemapping
  labels:
    testing.upbound.io/example-name: org_group_role_mapping_import
  name: org-group-role-mapping-import
  namespace: crossplane-system
spec:
  forProvider:
    externalGroupName: myGrouptest
    federationSettingsId: 627a9687f7f7f7f774de306f14
    orgId: ${data.mongodbatlas.org_id}
    roleAssignments:
    - orgId: ${data.mongodbatlas.org_id}
      roles:
      - ORG_MEMBER
      - ORG_GROUP_CREATOR
      - ORG_BILLING_ADMIN
    - groupId: ${data.mongodbatlas.project_id}
      roles:
      - GROUP_OWNER
      - GROUP_DATA_ACCESS_ADMIN
      - GROUP_SEARCH_INDEX_EDITOR
      - GROUP_DATA_ACCESS_READ_ONLY
      - GROUP_DATA_ACCESS_READ_WRITE
