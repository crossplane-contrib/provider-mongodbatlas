apiVersion: ldap.mongodbatlas.m.crossplane.io/v1alpha1
kind: Verify
metadata:
  annotations:
    meta.upbound.io/example-id: ldap/v1alpha1/verify
    upjet.upbound.io/manual-intervention: "Needs a reachable LDAP server and bind credentials in the referenced Secret."
  labels:
    testing.upbound.io/example-name: verify-test
  name: verify-test
  namespace: crossplane-system
spec:
  forProvider:
    bindPasswordSecretRef:
      key: example-key
      name: example-secret
    bindUsername: CN=atlas,OU=users,DC=example,DC=com
    hostname: ldap.example.com
    port: 636
    projectId: ${data.mongodbatlas.project_id}

---

apiVersion: mongodbatlas.m.crossplane.io/v1alpha3
kind: AdvancedCluster
metadata:
  annotations:
    meta.upbound.io/example-id: ldap/v1alpha1/verify
    upjet.upbound.io/manual-intervention: "Needs a reachable LDAP server and bind credentials in the referenced Secret."
  labels:
    testing.upbound.io/example-name: verify-test
  name: verify-test
  namespace: crossplane-system
spec:
  forProvider:
    backupEnabled: true
    clusterType: REPLICASET
    name: ${Rand.RFC1123Subdomain}
    projectId: ${data.mongodbatlas.project_id}
    replicationSpecs:
    - regionConfigs:
      - electableSpecs:
          instanceSize: M10
          nodeCount: 3
        priority: 7
        providerName: AWS
        regionName: US_EAST_1
