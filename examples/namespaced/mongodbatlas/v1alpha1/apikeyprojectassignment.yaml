apiVersion: mongodbatlas.m.crossplane.io/v1alpha1
kind: APIKeyProjectAssignment
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/apikeyprojectassignment
  labels:
    testing.upbound.io/example-name: apikeyprojectassignment-first_assignment
  name: apikeyprojectassignment-first-assignment
  namespace: crossplane-system
spec:
  forProvider:
    apiKeyIdSelector:
      matchLabels:
        testing.upbound.io/example-name: apikeyprojectassignment-this
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: apikeyprojectassignment-first_project
    roles:
    - GROUP_OWNER

---

apiVersion: mongodbatlas.m.crossplane.io/v1alpha1
kind: AccessListAPIKey
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/apikeyprojectassignment
  labels:
    testing.upbound.io/example-name: apikeyprojectassignment-this
  name: apikeyprojectassignment-this
  namespace: crossplane-system
spec:
  forProvider:
    apiKeyIdSelector:
      matchLabels:
        testing.upbound.io/example-name: apikeyprojectassignment-this
    cidrBlock: 0.0.0.0/1
    orgId: ${data.mongodbatlas.org_id}

---

apiVersion: mongodbatlas.m.crossplane.io/v1alpha1
kind: APIKey
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/apikeyprojectassignment
  labels:
    testing.upbound.io/example-name: apikeyprojectassignment-this
  name: apikeyprojectassignment-this
  namespace: crossplane-system
spec:
  forProvider:
    description: Test API Key
    orgId: ${data.mongodbatlas.org_id}
    roleNames:
    - ORG_READ_ONLY

---

apiVersion: mongodbatlas.m.crossplane.io/v1alpha1
kind: Project
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/apikeyprojectassignment
  labels:
    testing.upbound.io/example-name: apikeyprojectassignment-first_project
  name: apikeyprojectassignment-first-project
  namespace: crossplane-system
spec:
  forProvider:
    name: ${Rand.RFC1123Subdomain}
    orgId: ${data.mongodbatlas.org_id}
