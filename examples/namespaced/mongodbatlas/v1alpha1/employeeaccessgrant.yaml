apiVersion: mongodbatlas.m.crossplane.io/v1alpha1
kind: EmployeeAccessGrant
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/employeeaccessgrant
    uptest.upbound.io/timeout: "3600"
  labels:
    testing.upbound.io/example-name: employeeaccessgrant-example
  name: employeeaccessgrant-example
  namespace: crossplane-system
spec:
  forProvider:
    clusterNameSelector:
      matchLabels:
        testing.upbound.io/example-name: employeeaccessgrant-example
    expirationTime: "2030-01-01T00:00:00Z"
    grantType: CLUSTER_INFRASTRUCTURE_AND_APP_SERVICES_SYNC_DATA
    projectId: ${data.mongodbatlas.project_id}

---

apiVersion: mongodbatlas.m.crossplane.io/v1alpha3
kind: AdvancedCluster
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/employeeaccessgrant
  labels:
    testing.upbound.io/example-name: employeeaccessgrant-example
  name: employeeaccessgrant-example
  namespace: crossplane-system
spec:
  forProvider:
    clusterType: REPLICASET
    name: ${Rand.RFC1123Subdomain}
    projectId: ${data.mongodbatlas.project_id}
    replicationSpecs:
    - regionConfigs:
      - electableSpecs:
          instanceSize: M10
          nodeCount: 3
        priority: 7
        providerName: AWS
        regionName: US_EAST_1
