apiVersion: mongodbatlas.m.crossplane.io/v1alpha1
kind: EncryptionAtRest
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/encryptionatrest
    upjet.upbound.io/manual-intervention: "Needs an AWS KMS key and an AWS IAM role that trusts the Atlas AWS account."
  labels:
    testing.upbound.io/example-name: encryptionatrest-test
  name: encryptionatrest-test
  namespace: crossplane-system
spec:
  forProvider:
    awsKmsConfig:
    - customerMasterKeyIdSecretRef:
        key: attribute.id
        name: example-kms-key
      enabled: true
      region: US_EAST_1
      roleIdSelector:
        matchLabels:
          testing.upbound.io/example-name: encryptionatrest-auth_role
    enabledForSearchNodes: true
    projectId: ${data.mongodbatlas.project_id}

---

apiVersion: mongodbatlas.m.crossplane.io/v1alpha3
kind: AdvancedCluster
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/encryptionatrest
    upjet.upbound.io/manual-intervention: "Needs an AWS KMS key and an AWS IAM role that trusts the Atlas AWS account."
  labels:
    testing.upbound.io/example-name: encryptionatrest-cluster
  name: encryptionatrest-cluster
  namespace: crossplane-system
spec:
  forProvider:
    backupEnabled: true
    clusterType: REPLICASET
    encryptionAtRestProvider: AWS
    name: ${Rand.RFC1123Subdomain}
    projectId: ${data.mongodbatlas.project_id}
    replicationSpecs:
    - regionConfigs:
      - electableSpecs:
          instanceSize: M10
          nodeCount: 3
        priority: 7
        providerName: AWS
        regionName: US_EAST_1

---

apiVersion: cloud.mongodbatlas.m.crossplane.io/v1alpha1
kind: ProviderAccessAuthorization
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/encryptionatrest
    upjet.upbound.io/manual-intervention: "Needs an AWS KMS key and an AWS IAM role that trusts the Atlas AWS account."
  labels:
    testing.upbound.io/example-name: encryptionatrest-auth_role
  name: encryptionatrest-auth-role
  namespace: crossplane-system
spec:
  forProvider:
    aws:
    - iamAssumedRoleArn: arn:aws:iam::123456789012:role/atlas-kms-access
    projectId: ${data.mongodbatlas.project_id}
    roleIdSelector:
      matchLabels:
        testing.upbound.io/example-name: encryptionatrest-setup_only

---

apiVersion: cloud.mongodbatlas.m.crossplane.io/v1alpha1
kind: ProviderAccessSetup
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/encryptionatrest
    upjet.upbound.io/manual-intervention: "Needs an AWS KMS key and an AWS IAM role that trusts the Atlas AWS account."
  labels:
    testing.upbound.io/example-name: encryptionatrest-setup_only
  name: encryptionatrest-setup-only
  namespace: crossplane-system
spec:
  forProvider:
    projectId: ${data.mongodbatlas.project_id}
    providerName: AWS
