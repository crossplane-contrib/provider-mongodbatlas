apiVersion: mongodbatlas.m.crossplane.io/v1alpha1
kind: EventTrigger
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/eventtrigger
    upjet.upbound.io/manual-intervention: "Needs an App Services app, function and linked data source."
  labels:
    testing.upbound.io/example-name: eventtrigger-test
  name: eventtrigger-test
  namespace: crossplane-system
spec:
  forProvider:
    appId: <app-services-app-id>
    configCollection: example_collection
    configDatabase: example_db
    configFullDocument: false
    configFullDocumentBefore: false
    configMatch: |
      {
        "updateDescription.updatedFields": {
          "status": "blocked"
        }
      }
    configOperationTypes:
    - INSERT
    - UPDATE
    configProject: '{"updateDescription.updatedFields":{"status":"blocked"}}'
    configServiceId: <app-services-data-source-id>
    disabled: false
    eventProcessors:
    - awsEventbridge:
      - configAccountId: "123456789012"
        configRegion: US_EAST_1
    functionId: <app-services-function-id>
    name: example-trigger
    projectId: ${data.mongodbatlas.project_id}
    type: DATABASE
