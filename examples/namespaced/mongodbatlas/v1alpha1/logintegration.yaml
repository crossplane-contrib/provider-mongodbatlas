apiVersion: mongodbatlas.m.crossplane.io/v1alpha1
kind: LogIntegration
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/logintegration
    upjet.upbound.io/manual-intervention: "Needs an existing S3 bucket and an AWS IAM role that trusts the Atlas AWS account."
  labels:
    testing.upbound.io/example-name: logintegration-example
  name: logintegration-example
  namespace: crossplane-system
spec:
  forProvider:
    bucketName: example-atlas-logs
    iamRoleIdSelector:
      matchLabels:
        testing.upbound.io/example-name: logintegration-auth
    logTypes:
    - MONGOD_AUDIT
    prefixPath: atlas-logs
    projectId: ${data.mongodbatlas.project_id}
    type: S3_LOG_EXPORT
    useLegacyPathStructure: false

---

apiVersion: cloud.mongodbatlas.m.crossplane.io/v1alpha1
kind: ProviderAccessAuthorization
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/logintegration
    upjet.upbound.io/manual-intervention: "Needs an existing S3 bucket and an AWS IAM role that trusts the Atlas AWS account."
  labels:
    testing.upbound.io/example-name: logintegration-auth
  name: logintegration-auth
  namespace: crossplane-system
spec:
  forProvider:
    aws:
    - iamAssumedRoleArn: arn:aws:iam::123456789012:role/atlas-log-export
    projectId: ${data.mongodbatlas.project_id}
    roleIdSelector:
      matchLabels:
        testing.upbound.io/example-name: logintegration-setup

---

apiVersion: cloud.mongodbatlas.m.crossplane.io/v1alpha1
kind: ProviderAccessSetup
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/logintegration
    upjet.upbound.io/manual-intervention: "Needs an existing S3 bucket and an AWS IAM role that trusts the Atlas AWS account."
  labels:
    testing.upbound.io/example-name: logintegration-setup
  name: logintegration-setup
  namespace: crossplane-system
spec:
  forProvider:
    projectId: ${data.mongodbatlas.project_id}
    providerName: AWS
