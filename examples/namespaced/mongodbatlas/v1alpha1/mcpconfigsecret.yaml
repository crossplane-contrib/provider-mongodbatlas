apiVersion: mongodbatlas.m.crossplane.io/v1alpha1
kind: MCPConfigSecret
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/mcpconfigsecret
  labels:
    testing.upbound.io/example-name: mcpconfigsecret-example
  name: mcpconfigsecret-example
  namespace: crossplane-system
spec:
  forProvider:
    mcpConfigIdSelector:
      matchLabels:
        testing.upbound.io/example-name: mcpconfigsecret-example
    orgId: ${data.mongodbatlas.org_id}
    secretExpiresAfterHours: 720
  writeConnectionSecretToRef:
    name: mcpconfigsecret-example

---

apiVersion: mongodbatlas.m.crossplane.io/v1alpha1
kind: MCPConfig
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/mcpconfigsecret
  labels:
    testing.upbound.io/example-name: mcpconfigsecret-example
  name: mcpconfigsecret-example
  namespace: crossplane-system
spec:
  forProvider:
    mcpConfigName: mcpconfigsecret-example
    orgId: ${data.mongodbatlas.org_id}
    roles:
    - ORG_READ_ONLY
