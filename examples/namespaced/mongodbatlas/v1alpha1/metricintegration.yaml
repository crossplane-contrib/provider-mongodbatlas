apiVersion: mongodbatlas.m.crossplane.io/v1alpha1
kind: MetricIntegration
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/metricintegration
  labels:
    testing.upbound.io/example-name: metricintegration-example
  name: metricintegration-example
  namespace: crossplane-system
spec:
  forProvider:
    aggregationTemporality: DELTA
    authType: HEADER
    endpoint: ${data.datadog.otlp_metrics_endpoint}
    headers:
    - name: dd-api-key
      valueSecretRef:
        key: api-key
        name: metricintegration-datadog-api-key
    integrationType: OTEL
    metricSelection:
    - ATLAS_STREAM_PROCESSING
    projectId: ${data.mongodbatlas.project_id}
    providerType: CUSTOM

---

apiVersion: v1
kind: Secret
metadata:
  name: metricintegration-datadog-api-key
  namespace: crossplane-system
type: Opaque
stringData:
  api-key: ${data.datadog.api_key}
