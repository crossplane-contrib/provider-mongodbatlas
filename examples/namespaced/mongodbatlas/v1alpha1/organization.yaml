apiVersion: mongodbatlas.m.crossplane.io/v1alpha1
kind: Organization
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/organization
    upjet.upbound.io/manual-intervention: "Creating organizations needs a paying organization with cross-organization billing and an API key allowed to create organizations."
  labels:
    testing.upbound.io/example-name: organization-this
  name: organization-this
  namespace: crossplane-system
spec:
  forProvider:
    description: test API key from Org Creation
    name: ${Rand.RFC1123Subdomain}
    orgOwnerId: ${data.mongodbatlas.user_id}
    roleNames:
    - ORG_OWNER
