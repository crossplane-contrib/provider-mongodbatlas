apiVersion: mongodbatlas.m.crossplane.io/v1alpha1
kind: PartyIntegration
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/partyintegration
    upjet.upbound.io/manual-intervention: "Needs a Datadog account and API key in the referenced Secret."
  labels:
    testing.upbound.io/example-name: partyintegration-test_datadog
  name: partyintegration-test-datadog
  namespace: crossplane-system
spec:
  forProvider:
    apiKeySecretRef:
      key: example-key
      name: example-secret
    projectId: ${data.mongodbatlas.project_id}
    region: US
    type: DATADOG
