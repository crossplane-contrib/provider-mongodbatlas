apiVersion: mongodbatlas.m.crossplane.io/v1alpha1
kind: ServiceAccountProjectAssignment
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/serviceaccountprojectassignment
  labels:
    testing.upbound.io/example-name: serviceaccountprojectassignment-this
  name: serviceaccountprojectassignment-this
  namespace: crossplane-system
spec:
  forProvider:
    clientIdSelector:
      matchLabels:
        testing.upbound.io/example-name: serviceaccountprojectassignment-this
    projectId: ${data.mongodbatlas.project_id}
    roles:
    - GROUP_READ_ONLY

---

apiVersion: mongodbatlas.m.crossplane.io/v1alpha1
kind: ServiceAccount
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha1/serviceaccountprojectassignment
  labels:
    testing.upbound.io/example-name: serviceaccountprojectassignment-this
  name: serviceaccountprojectassignment-this
  namespace: crossplane-system
spec:
  forProvider:
    description: Example Service Account
    name: example-service-account
    orgId: ${data.mongodbatlas.org_id}
    roles:
    - ORG_MEMBER
    secretExpiresAfterHours: 2160
