apiVersion: mongodbatlas.m.crossplane.io/v1alpha3
kind: AdvancedCluster
metadata:
  annotations:
    meta.upbound.io/example-id: mongodbatlas/v1alpha3/advancedcluster
    uptest.upbound.io/timeout: "3600"
  labels:
    testing.upbound.io/example-name: advancedcluster-this
  name: advancedcluster-this
  namespace: crossplane-system
spec:
  forProvider:
    clusterType: REPLICASET
    name: ${Rand.RFC1123Subdomain}
    projectId: ${data.mongodbatlas.project_id}
    replicationSpecs:
    - regionConfigs:
      - analyticsSpecs:
          instanceSize: M10
          nodeCount: 1
        electableSpecs:
          instanceSize: M10
          nodeCount: 3
        priority: 7
        providerName: AWS
        regionName: US_EAST_1
