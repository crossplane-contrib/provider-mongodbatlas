apiVersion: privateendpoint.mongodbatlas.m.crossplane.io/v1alpha1
kind: RegionalMode
metadata:
  annotations:
    meta.upbound.io/example-id: privateendpoint/v1alpha1/regionalmode
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: crossplane-system
spec:
  forProvider:
    enabled: true
    projectId: ${data.mongodbatlas.project_id}

---

apiVersion: mongodbatlas.m.crossplane.io/v1alpha3
kind: AdvancedCluster
metadata:
  annotations:
    meta.upbound.io/example-id: privateendpoint/v1alpha1/regionalmode
  labels:
    testing.upbound.io/example-name: cluster_atlas
  name: cluster-atlas
  namespace: crossplane-system
spec:
  forProvider:
    backupEnabled: true
    clusterType: GEOSHARDED
    name: ${var.cluster_name}
    projectId: ${data.mongodbatlas.project_id}
    replicationSpecs:
    - regionConfigs:
      - electableSpecs:
          instanceSize: M30
          nodeCount: 3
        priority: 7
        providerName: AWS
        regionName: ${var.atlas_region_east}
      - electableSpecs:
          instanceSize: M30
          nodeCount: 2
        priority: 6
        providerName: AWS
        regionName: ${var.atlas_region_west}
      zoneName: Zone 1
    - regionConfigs:
      - electableSpecs:
          instanceSize: M30
          nodeCount: 3
        priority: 7
        providerName: AWS
        regionName: ${var.atlas_region_east}
      - electableSpecs:
          instanceSize: M30
          nodeCount: 2
        priority: 6
        providerName: AWS
        regionName: ${var.atlas_region_west}
      zoneName: Zone 1

---

apiVersion: privateendpoint.mongodbatlas.m.crossplane.io/v1alpha1
kind: Resource
metadata:
  annotations:
    meta.upbound.io/example-id: privateendpoint/v1alpha1/regionalmode
  labels:
    testing.upbound.io/example-name: test_east
  name: test-east
  namespace: crossplane-system
spec:
  forProvider:
    projectId: ${data.mongodbatlas.project_id}

---

apiVersion: privateendpoint.mongodbatlas.m.crossplane.io/v1alpha1
kind: Resource
metadata:
  annotations:
    meta.upbound.io/example-id: privateendpoint/v1alpha1/regionalmode
  labels:
    testing.upbound.io/example-name: test_west
  name: test-west
  namespace: crossplane-system
spec:
  forProvider:
    projectId: ${data.mongodbatlas.project_id}
    providerName: AWS
    region: US_WEST_1

---

apiVersion: privateendpoint.mongodbatlas.m.crossplane.io/v1alpha1
kind: Service
metadata:
  annotations:
    meta.upbound.io/example-id: privateendpoint/v1alpha1/regionalmode
  labels:
    testing.upbound.io/example-name: test_west
  name: test-west
  namespace: crossplane-system
spec:
  forProvider:
    endpointServiceId: ${aws_vpc_endpoint.test_west.id}
    privateLinkIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test_west
    projectId: ${data.mongodbatlas.project_id}
    providerName: AWS
