apiVersion: privateendpoint.mongodbatlas.m.crossplane.io/v1alpha1
kind: RegionalMode
metadata:
  annotations:
    meta.upbound.io/example-id: privateendpoint/v1alpha1/regionalmode
    upjet.upbound.io/manual-intervention: "Needs an AWS interface VPC endpoint created against the Atlas endpoint service."
  labels:
    testing.upbound.io/example-name: regionalmode-test
  name: regionalmode-test
  namespace: crossplane-system
spec:
  forProvider:
    enabled: true
    projectId: ${data.mongodbatlas.project_id}

---

apiVersion: mongodbatlas.m.crossplane.io/v1alpha3
kind: AdvancedCluster
metadata:
  annotations:
    meta.upbound.io/example-id: privateendpoint/v1alpha1/regionalmode
    upjet.upbound.io/manual-intervention: "Needs an AWS interface VPC endpoint created against the Atlas endpoint service."
  labels:
    testing.upbound.io/example-name: regionalmode-cluster_atlas
  name: regionalmode-cluster-atlas
  namespace: crossplane-system
spec:
  forProvider:
    backupEnabled: true
    clusterType: GEOSHARDED
    name: ${Rand.RFC1123Subdomain}
    projectId: ${data.mongodbatlas.project_id}
    replicationSpecs:
    - regionConfigs:
      - electableSpecs:
          instanceSize: M10
          nodeCount: 3
        priority: 7
        providerName: AWS
        regionName: US_EAST_1
      - electableSpecs:
          instanceSize: M10
          nodeCount: 2
        priority: 6
        providerName: AWS
        regionName: US_WEST_2
      zoneName: Zone 1

---

apiVersion: privateendpoint.mongodbatlas.m.crossplane.io/v1alpha1
kind: Resource
metadata:
  annotations:
    meta.upbound.io/example-id: privateendpoint/v1alpha1/regionalmode
    upjet.upbound.io/manual-intervention: "Needs an AWS interface VPC endpoint created against the Atlas endpoint service."
  labels:
    testing.upbound.io/example-name: regionalmode-test_east
  name: regionalmode-test-east
  namespace: crossplane-system
spec:
  forProvider:
    projectId: ${data.mongodbatlas.project_id}
    providerName: AWS
    region: US_EAST_1

---

apiVersion: privateendpoint.mongodbatlas.m.crossplane.io/v1alpha1
kind: Resource
metadata:
  annotations:
    meta.upbound.io/example-id: privateendpoint/v1alpha1/regionalmode
    upjet.upbound.io/manual-intervention: "Needs an AWS interface VPC endpoint created against the Atlas endpoint service."
  labels:
    testing.upbound.io/example-name: regionalmode-test_west
  name: regionalmode-test-west
  namespace: crossplane-system
spec:
  forProvider:
    projectId: ${data.mongodbatlas.project_id}
    providerName: AWS
    region: US_WEST_2

---

apiVersion: privateendpoint.mongodbatlas.m.crossplane.io/v1alpha1
kind: Service
metadata:
  annotations:
    meta.upbound.io/example-id: privateendpoint/v1alpha1/regionalmode
    upjet.upbound.io/manual-intervention: "Needs an AWS interface VPC endpoint created against the Atlas endpoint service."
  labels:
    testing.upbound.io/example-name: regionalmode-test_west
  name: regionalmode-test-west
  namespace: crossplane-system
spec:
  forProvider:
    endpointServiceId: vpce-0123456789abcdef0
    privateLinkIdSelector:
      matchLabels:
        testing.upbound.io/example-name: regionalmode-test_west
    projectId: ${data.mongodbatlas.project_id}
    providerName: AWS
