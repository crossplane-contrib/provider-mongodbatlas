apiVersion: project.mongodbatlas.m.crossplane.io/v1alpha1
kind: ServiceAccountAccessListEntry
metadata:
  annotations:
    meta.upbound.io/example-id: project/v1alpha1/serviceaccountaccesslistentry
  labels:
    testing.upbound.io/example-name: serviceaccountaccesslistentry-cidr
  name: serviceaccountaccesslistentry-cidr
  namespace: crossplane-system
spec:
  forProvider:
    cidrBlock: 1.2.3.4/32
    clientIdSelector:
      matchLabels:
        testing.upbound.io/example-name: serviceaccountaccesslistentry-this
    projectId: ${data.mongodbatlas.project_id}

---

apiVersion: project.mongodbatlas.m.crossplane.io/v1alpha1
kind: ServiceAccount
metadata:
  annotations:
    meta.upbound.io/example-id: project/v1alpha1/serviceaccountaccesslistentry
  labels:
    testing.upbound.io/example-name: serviceaccountaccesslistentry-this
  name: serviceaccountaccesslistentry-this
  namespace: crossplane-system
spec:
  forProvider:
    description: Example Project Service Account
    name: example-project-service-account
    projectId: ${data.mongodbatlas.project_id}
    roles:
    - GROUP_READ_ONLY
    secretExpiresAfterHours: 2160
