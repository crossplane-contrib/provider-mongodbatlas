apiVersion: stream.mongodbatlas.m.crossplane.io/v1alpha1
kind: ConnectionFailover
metadata:
  annotations:
    meta.upbound.io/example-id: stream/v1alpha1/connectionfailover
    upjet.upbound.io/manual-intervention: "Needs reachable Kafka brokers and credentials in the referenced Secret."
  labels:
    testing.upbound.io/example-name: connectionfailover-example
  name: connectionfailover-example
  namespace: crossplane-system
spec:
  forProvider:
    authentication:
      mechanism: PLAIN
      passwordSecretRef:
        key: example-key
        name: example-secret
      username: failover-kafka-user
    bootstrapServers: failover-broker-1.example.com:9092,failover-broker-2.example.com:9092
    connectionNameSelector:
      matchLabels:
        testing.upbound.io/example-name: connectionfailover-example
    projectId: ${data.mongodbatlas.project_id}
    region: DUBLIN_IRL
    security:
      protocol: SASL_SSL
    type: Kafka
    workspaceNameSelector:
      matchLabels:
        testing.upbound.io/example-name: connectionfailover-example

---

apiVersion: stream.mongodbatlas.m.crossplane.io/v1alpha1
kind: Connection
metadata:
  annotations:
    meta.upbound.io/example-id: stream/v1alpha1/connectionfailover
    upjet.upbound.io/manual-intervention: "Needs reachable Kafka brokers and credentials in the referenced Secret."
  labels:
    testing.upbound.io/example-name: connectionfailover-example
  name: connectionfailover-example
  namespace: crossplane-system
spec:
  forProvider:
    authentication:
      mechanism: PLAIN
      passwordSecretRef:
        key: example-key
        name: example-secret
      username: kafka-user
    bootstrapServers: broker-1.example.com:9092,broker-2.example.com:9092
    connectionName: KafkaConnection
    projectId: ${data.mongodbatlas.project_id}
    security:
      protocol: SASL_SSL
    type: Kafka
    workspaceNameSelector:
      matchLabels:
        testing.upbound.io/example-name: connectionfailover-example

---

apiVersion: stream.mongodbatlas.m.crossplane.io/v1alpha1
kind: Workspace
metadata:
  annotations:
    meta.upbound.io/example-id: stream/v1alpha1/connectionfailover
    upjet.upbound.io/manual-intervention: "Needs reachable Kafka brokers and credentials in the referenced Secret."
  labels:
    testing.upbound.io/example-name: connectionfailover-example
  name: connectionfailover-example
  namespace: crossplane-system
spec:
  forProvider:
    dataProcessRegion:
      cloudProvider: AWS
      region: VIRGINIA_USA
    failoverRegions:
    - cloudProvider: AWS
      region: DUBLIN_IRL
    projectId: ${data.mongodbatlas.project_id}
    streamConfig:
      tier: SP10
    workspaceName: ${Rand.RFC1123Subdomain}
