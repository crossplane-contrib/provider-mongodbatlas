apiVersion: stream.mongodbatlas.m.crossplane.io/v1alpha1
kind: PrivatelinkEndpoint
metadata:
  annotations:
    meta.upbound.io/example-id: stream/v1alpha1/privatelinkendpoint
    upjet.upbound.io/manual-intervention: "Needs a Confluent Cloud PrivateLink network."
  labels:
    testing.upbound.io/example-name: privatelinkendpoint-test
  name: privatelinkendpoint-test
  namespace: crossplane-system
spec:
  forProvider:
    dnsDomain: example.us-east-1.aws.confluent.cloud
    dnsSubDomain:
    - use1-az1.example.us-east-1.aws.confluent.cloud
    projectId: ${data.mongodbatlas.project_id}
    providerName: AWS
    region: us-east-1
    serviceEndpointId: com.amazonaws.vpce.us-east-1.vpce-svc-0123456789abcdef0
    vendor: CONFLUENT
