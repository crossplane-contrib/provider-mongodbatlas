apiVersion: stream.mongodbatlas.m.crossplane.io/v1alpha1
kind: Processor
metadata:
  annotations:
    meta.upbound.io/example-id: stream/v1alpha1/processor
  labels:
    testing.upbound.io/example-name: processor-stream-processor-sample-example
  name: processor-stream-processor-sample-example
  namespace: crossplane-system
spec:
  forProvider:
    pipeline: |
      [
        {"$source": {"connectionName": "sample_stream_solar"}},
        {"$emit": {"connectionName": "__testLog"}}
      ]
    processorName: sampleProcessorName
    projectId: ${data.mongodbatlas.project_id}
    workspaceNameSelector:
      matchLabels:
        testing.upbound.io/example-name: processor-example

---

apiVersion: stream.mongodbatlas.m.crossplane.io/v1alpha1
kind: Connection
metadata:
  annotations:
    meta.upbound.io/example-id: stream/v1alpha1/processor
  labels:
    testing.upbound.io/example-name: processor-example-sample
  name: processor-example-sample
  namespace: crossplane-system
spec:
  forProvider:
    connectionName: sample_stream_solar
    projectId: ${data.mongodbatlas.project_id}
    type: Sample
    workspaceNameSelector:
      matchLabels:
        testing.upbound.io/example-name: processor-example

---

apiVersion: stream.mongodbatlas.m.crossplane.io/v1alpha1
kind: Workspace
metadata:
  annotations:
    meta.upbound.io/example-id: stream/v1alpha1/processor
  labels:
    testing.upbound.io/example-name: processor-example
  name: processor-example
  namespace: crossplane-system
spec:
  forProvider:
    dataProcessRegion:
      cloudProvider: AWS
      region: VIRGINIA_USA
    projectId: ${data.mongodbatlas.project_id}
    workspaceName: ${Rand.RFC1123Subdomain}
